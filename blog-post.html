    <style>
        /* 文章详情页样式 */
        .article-detail-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 30px;
        }
        
        .article-detail {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
        }
        
        .article-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.3s ease;
        }
        
        .back-link:hover {
            opacity: 0.8;
        }
        
        .article-detail-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.4;
            margin-bottom: 16px;
        }
        
        .article-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        
        .article-meta .article-date {
            font-size: 14px;
            color: var(--text-muted);
        }
        
        .article-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-color);
        }
        
        .article-content h2 {
            font-size: 22px;
            font-weight: 600;
            margin: 30px 0 16px 0;
            color: var(--text-color);
        }
        
        .article-content h3 {
            font-size: 18px;
            font-weight: 600;
            margin: 24px 0 12px 0;
            color: var(--text-color);
        }
        
        .article-content p {
            margin-bottom: 16px;
        }
        
        .article-content ol {
            margin: 16px 0;
            padding-left: 24px;
        }
        
        .article-content li {
            margin-bottom: 8px;
        }
        
        /* 相关文章推荐 */
        .related-articles {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 30px 30px;
        }
        
        .related-articles h4 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-color);
        }
        
        .related-articles-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        
        .article-card-small {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .article-card-small:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .article-card-small .article-category {
            font-size: 11px;
            padding: 3px 10px;
        }
        
        .article-card-small .article-title {
            font-size: 14px;
            margin: 10px 0 8px 0;
            line-height: 1.4;
        }
        
        .article-card-small .article-date {
            font-size: 12px;
        }
        
        .no-articles {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 16px;
        }
        
        /* 移动端适配 */
        @media (max-width: 767px) {
            .article-detail-container {
                padding: 0 16px;
            }
            
            .article-detail {
                padding: 24px 16px;
            }
            
            .article-detail-title {
                font-size: 22px;
            }
            
            .article-content {
                font-size: 15px;
            }
            
            .article-content h2 {
                font-size: 18px;
            }
            
            .related-articles {
                padding: 0 16px 24px;
            }
            
            .related-articles-list {
                grid-template-columns: 1fr;
            }
        }
        
        /* 平板适配 */
        @media (min-width: 768px) and (max-width: 1024px) {
            .article-detail-container {
                padding: 0 20px;
            }
            
            .article-detail {
                padding: 30px;
            }
            
            .related-articles {
                padding: 0 20px 24px;
            }
        }
    </style>
