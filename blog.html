    <style>
        /* 博客页面特定样式 */
        .blog-header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, #60a5fa 100%);
            border-radius: 16px;
            margin: 20px 30px 30px 30px;
            color: white;
        }
        
        .blog-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .blog-header p {
            font-size: 16px;
            color: white;
        }
        
        /* 分类标签 */
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0 30px;
            margin-bottom: 30px;
        }
        
        .category-tab {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .category-tab:hover {
            background: var(--primary);
            color: white;
        }
        
        .category-tab.active {
            background: var(--primary);
            color: white;
        }
        
        /* 文章卡片 */
        .blog-list-container {
            padding: 0 30px;
        }
        
        .article-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        
        .article-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .article-category {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .article-date {
            color: var(--text-muted);
            font-size: 13px;
        }
        
        .article-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .article-summary {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        
        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .article-tag {
            padding: 2px 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .no-articles {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 16px;
        }
        
        /* 移动端适配 */
        @media (max-width: 767px) {
            .blog-header {
                margin: 16px;
                padding: 30px 16px;
            }
            
            .blog-header h1 {
                font-size: 22px;
            }
            
            .blog-header p {
                font-size: 14px;
            }
            
            .category-tabs {
                padding: 0 16px;
                margin-bottom: 20px;
            }
            
            .category-tab {
                padding: 6px 14px;
                font-size: 13px;
            }
            
            .blog-list-container {
                padding: 0 16px;
            }
            
            .article-card {
                padding: 16px;
            }
            
            .article-title {
                font-size: 16px;
            }
            
            .article-summary {
                font-size: 13px;
            }
        }
        
        /* 平板适配 */
        @media (min-width: 768px) and (max-width: 1024px) {
            .blog-header {
                margin: 20px;
            }
            
            .category-tabs {
                padding: 0 20px;
            }
            
            .blog-list-container {
                padding: 0 20px;
            }
        }
    </style>
